# Release: push a tag like v0.6.0; .github/workflows/release.yml runs this.
version: 2
project_name: agentium
builds:
  - main: ./cmd/agentium
    binary: agentium
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - name_template: "agentium_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]
checksum:
  name_template: checksums.txt
release:
  name_template: "Agentium {{ .Tag }}"
  # Re-running a release refreshes its notes and binaries.
  mode: replace
  replace_existing_artifacts: true
# Used only when CHANGELOG.md has no section for the tag.
changelog:
  use: github
  sort: asc
  format: "{{ .SHA }} {{ .Message }}"
  filters:
    exclude:
      - "^Merge "
      - "^(ci|test|chore|docs)(\\(.*\\))?:"
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.*\))?:'
      order: 1
    - title: Other changes
      order: 999
