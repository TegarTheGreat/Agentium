# Release: push a tag like v0.6.0; .github/workflows/release.yml runs this.
version: 2
project_name: agentium
builds:
  - main: ./cmd/agentium
    binary: agentium
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - name_template: "agentium_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]
checksum:
  name_template: checksums.txt
changelog:
  use: github
