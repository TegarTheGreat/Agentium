name: release
on:
  push:
    tags: ["v*"]
  # Manual release: creates the tag on the chosen branch, then releases it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release (e.g. v0.11.0)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          # Keep this branch's GoReleaser config even when an older tag is checked out.
          cp .goreleaser.yaml "$RUNNER_TEMP/goreleaser.yaml"
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "NOTES=--release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          fi
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "tag must look like v1.2.3" >&2; exit 1 ;; esac
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"   # re-release an existing tag
          else
            git config user.name "Tegar Prayuda"
            git config user.email "268683956+TegarTheGreat@users.noreply.github.com"
            git tag -a "$TAG" -m "Agentium $TAG"
            git push origin "$TAG"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml ${{ env.NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
